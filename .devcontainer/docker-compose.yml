services:
  dev:
    image: mcr.microsoft.com/devcontainers/python:3.12
    volumes: [..:/workspace:cached]
    command: sleep infinity
    environment:
      STAYPAY_DATABASE_URL: postgresql+asyncpg://staypay:staypay@postgres:5432/staypay
      STAYPAY_REDIS_URL: redis://redis:6379/0
      STAYPAY_TEST_DATABASE_URL: postgresql+asyncpg://staypay:staypay@postgres:5432/staypay_test
      STAYPAY_TEST_REDIS_URL: redis://redis:6379/15
    depends_on: [postgres, redis]

  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: staypay, POSTGRES_PASSWORD: staypay, POSTGRES_DB: staypay }
    volumes: [../deploy/initdb:/docker-entrypoint-initdb.d:ro]

  redis:
    image: redis:7
