global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files: ["/etc/prometheus/alerts.yml"]

scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: workers
    static_configs:
      - targets: ["worker-charge:9101", "worker-inbox:9102", "worker-sweeper:9103", "worker-backfill:9104", "worker-cleanup:9105"]
